name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Allows to trigger a deployment manually from the Actions tab:
  workflow_dispatch:

# Allow the workflow to deploy to GitHub Pages:
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment:
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the game bundle
        # The old webpack version used by this project relies on a hash algorithm
        # that is disabled by default in Node.js >= 17, hence the legacy provider.
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npx webpack --mode production

      - name: Prepare the site
        run: touch app/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the site as an artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
